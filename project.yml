name: ILoveVigoRoutes
options:
  bundleIdPrefix: dev.threedots
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  VigoCore:
    path: VigoCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

schemes:
  ILoveVigoRoutes:
    build:
      targets:
        ILoveVigoRoutes: all
    test:
      targets:
        - ILoveVigoRoutesTests

targets:
  ILoveVigoRoutes:
    type: application
    platform: iOS
    sources:
      - path: App/ILoveVigoRoutes
    dependencies:
      - package: VigoCore
        product: VigoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.threedots.ILoveVigoRoutes
        INFOPLIST_FILE: App/ILoveVigoRoutes/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
  ILoveVigoRoutesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App/ILoveVigoRoutesTests
    dependencies:
      - target: ILoveVigoRoutes
      - package: VigoCore
        product: VigoCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ILoveVigoRoutes.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ILoveVigoRoutes"
        BUNDLE_LOADER: "$(TEST_HOST)"
